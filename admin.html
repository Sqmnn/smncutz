<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>SMN Cutz · Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: shop-counter app — header with pole stripe, three views (Today / Bookings / Clients), client file opens as a side sheet */
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --surface-2:#F6F7F8; --line:#D9DDE2;
  --ink:#15181E; --ink-2:#555C68; --ink-3:#8A909B;
  --accent:#A3172E; --accent-ink:#FFFFFF; --accent-soft:#F7E3E6;
  --navy:#1E3A64; --navy-soft:#E1E8F3;
  --ok:#1D7A4A; --ok-soft:#DDF1E5; --c-rev:#2E62C9; --c-cost:#B8213A; --warn:#A35C00; --warn-soft:#FBEBD2;
  --shadow:0 1px 2px rgba(20,24,30,.06),0 8px 24px rgba(20,24,30,.08);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --surface:#181B21; --surface-2:#1F232A; --line:#2C313A;
  --ink:#ECEEF1; --ink-2:#AAB0BA; --ink-3:#737A86;
  --accent:#E3485F; --accent-ink:#16080B; --accent-soft:#3A1920;
  --navy:#8DB1E8; --navy-soft:#1C2A40;
  --ok:#5CCB8C; --ok-soft:#15301F; --c-rev:#5B8FF0; --c-cost:#E3485F; --warn:#F0A646; --warn-soft:#3A2A12;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1115; --surface:#181B21; --surface-2:#1F232A; --line:#2C313A;
  --ink:#ECEEF1; --ink-2:#AAB0BA; --ink-3:#737A86;
  --accent:#E3485F; --accent-ink:#16080B; --accent-soft:#3A1920;
  --navy:#8DB1E8; --navy-soft:#1C2A40;
  --ok:#5CCB8C; --ok-soft:#15301F; --c-rev:#5B8FF0; --c-cost:#E3485F; --warn:#F0A646; --warn-soft:#3A2A12;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.brand h1{margin:0;font:800 28px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.brand .date{color:var(--ink-3);font-size:13px;white-space:nowrap}
.pole{height:5px;background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,var(--surface) 10px 16px,var(--navy) 16px 26px,var(--surface) 26px 32px)}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.tab{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:600;color:var(--ink-2);font-size:14px}
.tab[aria-current="true"]{background:var(--ink);color:var(--bg)}
.actions{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:7px}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--accent);border-color:var(--accent-soft)}
.btn.danger.armed{background:var(--accent);color:var(--accent-ink)}

main{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 100px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--navy-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;margin-bottom:18px;font-size:14px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:22px}
.stat{background:var(--surface);padding:14px 16px}
.stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.stat .v{font:800 34px/1.1 var(--f-display);margin-top:4px;font-variant-numeric:tabular-nums}
.stat .s{font-size:13px;color:var(--ink-2)}

.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px}
.sec-h h2{margin:0;font:800 22px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.sec-h .meta{color:var(--ink-3);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* appointment rows */
.appt{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.appt .t{flex:0 0 64px}
.appt .who{flex:1 1 170px}
.appt .right{margin-left:auto}
.appt:first-child{border-top:0}
.appt .t{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.appt .who{min-width:0}
.appt .who b{font-weight:600;cursor:pointer}
.appt .who b:hover{text-decoration:underline}
.appt .svc{color:var(--ink-2);font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.appt .right{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.appt.is-done .t,.appt.is-cancelled .t,.appt.is-no_show .t{color:var(--ink-3)}
.appt.is-cancelled .who b,.appt.is-declined .who b{text-decoration:line-through;color:var(--ink-3)}
.appt.paid{background:var(--ok-soft);box-shadow:inset 4px 0 0 var(--ok)}
.appt.unpaid{background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent)}
.paidbtn{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.unpaidbtn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.no{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.confirmed{background:var(--ok-soft);color:var(--ok)}
.pill.declined{background:var(--surface-2);color:var(--ink-3)}
.owed{color:var(--accent);font-weight:600}
.more{padding:8px 14px;border-top:1px solid var(--line)}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.booked{background:var(--navy-soft);color:var(--navy)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.no_show{background:var(--warn-soft);color:var(--warn)}
.pill.cancelled{background:var(--surface-2);color:var(--ink-3)}
.pill.due{background:var(--accent-soft);color:var(--accent)}
.req{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.req:first-child{border-top:0}
.req .info{flex:1;min-width:200px}
.req .info b{font-weight:600}
.req .info div{font-size:13px;color:var(--ink-2)}
.req .rn{font-style:italic}
.req .rt{color:var(--ink-3)!important;font-size:12px!important}
.req .ra{display:flex;gap:6px;align-items:center}
.count{display:inline-block;background:var(--accent);color:var(--accent-ink);font:600 13px/1 var(--f-body);padding:4px 8px;border-radius:999px;vertical-align:middle;letter-spacing:0}
.syncline a{color:var(--navy)}
.req .ig{font-size:13px;color:var(--navy);text-decoration:none;margin-left:4px}
.pf-note{color:var(--ink-2);font-size:14px;margin:0 0 12px;max-width:60ch}
.pfgrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.pfgrid .photo{position:relative}
.pfdel{position:absolute;right:6px;top:6px;background:var(--surface);opacity:.92}
@media (max-width:760px){ .tab{padding:10px 2px;font-size:13px} }
.pill.online{background:var(--ok-soft);color:var(--ok)}
.bookcard{padding:12px 14px;display:grid;gap:10px;margin-bottom:22px}
.linkrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.linkrow input{flex:1;min-width:180px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.linkrow .link{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px}
a.btn{text-decoration:none;color:inherit}
.syncline{font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;align-items:baseline}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none;transform:translateY(-1px)}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--warn)}
.price{font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.empty{padding:28px 18px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* due list */
.due{display:flex;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.due:first-child{border-top:0}
.due .info{flex:1;min-width:0}
.due .info b{font-weight:600;cursor:pointer}
.due .info div{font-size:13px;color:var(--ink-2)}

/* avatar */
.av{width:40px;height:40px;border-radius:50%;flex:none;background:var(--navy-soft);color:var(--navy);display:grid;place-items:center;font:800 16px var(--f-display);overflow:hidden;letter-spacing:.03em}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:76px;height:76px;font-size:28px}

/* week */
.weekbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.weekbar h2{margin:0 8px 0 0;font:800 22px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;flex:1;min-width:180px}
.days{display:grid;gap:14px}
.day h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.day.today h3{color:var(--accent)}
.day h3 .c{color:var(--ink-3);font-weight:500;letter-spacing:0;text-transform:none}
.day .none{font-size:13px;color:var(--ink-3);padding:4px 0 2px}

/* clients */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.search{flex:1;min-width:200px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column}
.ccard-main{background:none;border:0;padding:14px 14px 10px;display:flex;gap:12px;text-align:left;align-items:flex-start;width:100%;cursor:pointer;border-radius:var(--r) var(--r) 0 0}
.ccard .igh{font-weight:500;font-size:13px;color:var(--ink-3)}
.at{position:relative}
.at span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-2);pointer-events:none;font-weight:600}
.f .at input{padding-left:27px}
.chart-panel{padding:14px}
.chart-wrap svg{width:100%;height:auto;display:block}
.chart-wrap .grid{stroke:var(--line);stroke-width:1}
.chart-wrap .ax{fill:var(--ink-3);font:500 11px var(--f-body)}
.chart-wrap .ax.now{fill:var(--ink);font-weight:700}
.chart-wrap .rev{fill:var(--c-rev)} .chart-wrap .cost{fill:var(--c-cost)}
.chart-wrap .hit{fill:transparent} .chart-wrap .hit:hover{fill:var(--ink);fill-opacity:.05}
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .sw.rev{background:var(--c-rev)} .legend .sw.cost{background:var(--c-cost)}
.mtable table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px;font-variant-numeric:tabular-nums}
.mtable th,.mtable td{text-align:right;padding:6px 8px;border-top:1px solid var(--line)}
.mtable th:first-child,.mtable td:first-child{text-align:left}
.mtable th{color:var(--ink-3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;border-top:0}
.neg{color:var(--accent)}
.addm{padding:14px;display:grid;gap:8px}
.addm input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 11px}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .mi{flex:1;min-width:0;display:grid}
.mrow .mi b{font-weight:600;overflow-wrap:anywhere}
.mrow .mi span{font-size:12px;color:var(--ink-3)}
.ma{font:500 14px var(--f-mono);white-space:nowrap}
.ma.expense{color:var(--accent)} .ma.income{color:var(--ok)}
.cacts{display:flex;gap:6px;padding:0 14px 12px;flex-wrap:wrap}
.cacts .btn.no{margin-left:auto}
.ccard:hover{border-color:var(--ink-3)}
.ccard .body{min-width:0;flex:1}
.ccard .nm{font-weight:600;font-size:15px}
.ccard .cut{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.tag{font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:2px 7px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);z-index:41;overflow-y:auto;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:2}
.sheet-b{padding:18px 16px 40px;display:grid;gap:18px}
.idcard{display:flex;gap:14px;align-items:center}
.idcard h2{margin:0;font:800 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.idcard .ph{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mini{background:var(--surface);padding:10px 12px}
.mini .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.mini .v{font:800 22px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.mini .s{font-size:12px;color:var(--ink-2)}
.cutcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.cutcard .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;margin-bottom:3px}
.cutcard p{margin:0;white-space:pre-wrap}
.cutcard p + .k{margin-top:10px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photo{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--surface-2);border:0;padding:0;max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .d{position:absolute;left:0;right:0;bottom:0;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));padding:10px 6px 4px;text-align:left}
.upload{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;text-align:center;color:var(--ink-2);font-size:13px;cursor:pointer;background:var(--surface)}
.upload:hover{border-color:var(--ink-3)}
.hist .appt .t{flex-basis:96px}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
.lb img{max-width:100%;max-height:78vh;border-radius:8px}
.lb .bar{display:flex;gap:8px;color:#fff;align-items:center;flex-wrap:wrap;justify-content:center}
.lb .btn{background:#222;border-color:#444;color:#fff}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(10,12,16,.5);overflow-y:auto}
.mbox{background:var(--surface);border-radius:14px;width:min(480px,100%);box-shadow:var(--shadow);max-height:calc(100% - 20px);overflow-y:auto}
.mbox h2{margin:0;padding:16px 18px 0;font:800 24px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.form{padding:14px 18px 18px;display:grid;gap:12px}
.f label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 11px}
.f textarea{min-height:70px;resize:vertical}
.f .hint{font-size:12px;color:var(--ink-3);margin-top:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mfoot{display:flex;gap:8px;justify-content:space-between;align-items:center;padding-top:4px;flex-wrap:wrap}
.mfoot .r{display:flex;gap:8px;margin-left:auto}
.err{color:var(--accent);font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:70;box-shadow:var(--shadow)}
.offline{max-width:520px;margin:60px auto;text-align:center;color:var(--ink-2)}
.offline h2{font:800 28px var(--f-display);text-transform:uppercase;color:var(--ink);margin:0 0 8px}
.skel{height:64px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);opacity:.6}

/* phone */
@media (max-width:760px){
  .tabs{position:fixed;left:0;right:0;bottom:0;border-radius:0;border:0;border-top:1px solid var(--line);background:var(--surface);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:30}
  .tab{flex:1;padding:10px 6px}
  .top-in{gap:10px}
  .brand h1{font-size:24px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .cols{grid-template-columns:minmax(0,1fr)}
  .appt .t{flex-basis:52px}
  .appt .right{flex-basis:100%;justify-content:flex-start;padding-left:64px;margin-left:0}
  .hist .appt .t{flex-basis:80px}
  .hist .appt .right{padding-left:92px}
  .two{grid-template-columns:1fr}
  .minis{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:420px){ .actions .btn .lbl{display:none} .brand .date{display:none} }
@media (prefers-reduced-motion:no-preference){ .sheet{animation:slide .18s ease-out} @keyframes slide{from{transform:translateX(24px);opacity:.6}} }

/* page basics (the artifact viewer used to supply these) */
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-box{width:min(380px,100%);display:grid;gap:14px}

<body>
<section class="login" id="login" hidden>
  <form class="login-box" id="loginForm">
    <div class="pole" aria-hidden="true" style="border-radius:3px"></div>
    <h1>SMN Cutz</h1>
    <p>Shop login. Only the owner can get in.</p>
    <label for="loginEmail" class="sr" style="position:absolute;left:-9999px">Email</label>
    <input id="loginEmail" type="email" autocomplete="username" placeholder="Email" required>
    <label for="loginPass" class="sr" style="position:absolute;left:-9999px">Password</label>
    <input id="loginPass" type="password" autocomplete="current-password" placeholder="Password">
    <button class="btn primary" id="loginBtn" type="submit">Log in</button>
    <button class="btn ghost" id="linkBtn" type="button" style="font-size:13px">Forgot password? Email me a login link</button>
    <div id="loginMsg" role="status"></div>
  </form>
</section>
<div id="app" hidden>
<header class="top">
  <div class="top-in">
    <div class="brand"><h1 id="shopName">SMN Cutz</h1><span class="date" id="todayLbl"></span></div>
    <nav class="tabs" aria-label="Views">
      <button class="tab" data-view="today" aria-current="true">Today</button>
      <button class="tab" data-view="bookings">Bookings</button>
      <button class="tab" data-view="clients">Clients</button>
      <button class="tab" data-view="portfolio">Portfolio</button>
      <button class="tab" data-view="money">Money</button>
    </nav>
    <div class="actions">
      <a class="btn ghost out bp" href="/" target="_blank" rel="noopener">Booking page</a>
      <button class="btn ghost out" id="logoutBtn" type="button">Log out</button>
      <button class="btn" id="addClientBtn" title="New client">+ <span class="lbl">Client</span></button>
      <button class="btn primary" id="addBookingBtn" title="New booking">+ <span class="lbl">Booking</span></button>
    </div>
  </div>
  <div class="pole" aria-hidden="true"></div>
</header>

<main id="main">
  <div class="stats"><div class="stat"><div class="k">Today</div><div class="v">–</div></div><div class="stat"><div class="k">Takings</div><div class="v">–</div></div><div class="stat"><div class="k">Due for a cut</div><div class="v">–</div></div><div class="stat"><div class="k">Cuts this month</div><div class="v">–</div></div></div>
  <div class="skel"></div>
</main>

<div id="sheetRoot"></div>
<div id="modalRoot"></div>
<div id="lbRoot"></div>
<div id="toastRoot"></div>
</div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>
<input type="file" id="pfIn" accept="image/*" multiple hidden>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diff = (a,b) => Math.round((parse(b)-parse(a))/86400000); // b - a in days
const TODAY = iso(new Date());
const monday = s => { const d = parse(s); const w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return iso(d); };
const fmtDay = s => parse(s).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
const fmtShort = s => parse(s).toLocaleDateString(undefined,{month:"short",day:"numeric"});
const fmtLong = s => parse(s).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
const fmtTime = t => { if(!t) return "—"; const [h,m] = t.split(":").map(Number); const ap = h>=12?"pm":"am"; return ((h%12)||12)+":"+pad(m)+ap; };
const money = n => { const v = Math.round((+n||0)*100)/100; return (v<0?"−$":"$")+Math.abs(v).toLocaleString(undefined,{maximumFractionDigits:2}); };
const initials = n => (n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase();
const ago = days => days===0?"today":days===1?"yesterday":days<0?("in "+(-days)+" days"):days<14?(days+" days ago"):days<60?(Math.round(days/7)+" wks ago"):(Math.round(days/30)+" mo ago");
const cycleText = d => d==null?"—":d<10?("every "+d+" days"):("every ~"+(Math.round(d/7*2)/2)+" wks");
const MENU = [
  {id:"cut",   name:"Haircut",  price:25, mins:30},
  {id:"brows", name:"Eyebrows", price:5,  mins:10, alone:5},
  {id:"beard", name:"Beard",    price:10, mins:15, alone:15},
  {id:"other", name:"Other",    price:0,  mins:0},
];
const TZ = (()=>{ try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "America/New_York"; } catch(_){ return "America/New_York"; } })();
function pickFromText(t){
  t = String(t||"").toLowerCase(); const s = new Set();
  if (/\bcut|haircut|scissor|fade|taper|line ?up/.test(t)) s.add("cut");
  if (/beard|facial/.test(t)) s.add("beard");
  if (/brow/.test(t)) s.add("brows");
  if (/\bother\b/.test(t)) s.add("other");
  if (!s.size) s.add("cut");
  return s;
}
function priceFor(set){ const c = set.has("cut"); return MENU.reduce((s,m)=>set.has(m.id) ? s + (c||m.id==="cut" ? m.price : (m.alone ?? m.price)) : s, 0); }
function minsFor(set){ return Math.max(15, MENU.reduce((s,m)=>set.has(m.id) ? s+m.mins : s, 0)); }
function labelFor(set){ const n = MENU.filter(m=>set.has(m.id)).map(m=>m.name); return (!set.has("cut") && n.length===1 && n[0]!=="Other") ? n[0]+" only" : n.join(" + "); }
const STATUS = {booked:"Pending",confirmed:"Confirmed",done:"Completed",declined:"Declined",no_show:"No-show",cancelled:"Cancelled"};

/* ---------- state ---------- */
const S = { clients:new Map(), bookings:new Map(), settings:{}, view:"today", week:monday(TODAY), q:"", sort:"due",
  open:null, db:null, assets:null, mcp:null, gotC:false, gotB:false, err:null, requests:[], handled:new Set(), req:null, money:[] };
try { const v = localStorage.getItem("cb.view"); if (v) S.view = v; const so = localStorage.getItem("cb.sort"); if (so) S.sort = so; } catch(e){}

$("#todayLbl").textContent = fmtLong(TODAY);

/* ---------- derived ---------- */
function bookingsOf(cid){ return [...S.bookings.values()].filter(b=>b.clientId===cid); }
function statsFor(c){
  const all = bookingsOf(c.id).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const done = all.filter(b=>b.status==="done");
  const dates = [...new Set(done.map(b=>b.date))];
  let avg = null;
  if (dates.length>=2){ let t=0; for(let i=1;i<dates.length;i++) t+=diff(dates[i-1],dates[i]); avg = Math.round(t/(dates.length-1)); }
  const cycle = c.cycleWeeks ? Math.round(c.cycleWeeks*7) : avg;
  const last = dates.length ? dates[dates.length-1] : null;
  const next = all.find(b=>(b.status==="booked"||b.status==="confirmed") && b.date>=TODAY) || null;
  const spent = done.filter(b=>b.paid!==false).reduce((s,b)=>s+(+b.price||0),0);
  let dueIn = null;
  if (last){ const cyc = cycle || 28; dueIn = diff(TODAY, addDays(last,cyc)); }
  const noShows = all.filter(b=>b.status==="no_show").length;
  return { all, done, visits:dates.length, avg, cycle, last, next, spent, dueIn, noShows, sinceLast: last?diff(last,TODAY):null };
}
function clientName(id, fallback){ const c = S.clients.get(id); return c ? c.name : (fallback || "Walk-in"); }
function latestPhoto(c){ const p = (c.photos||[]); return p.length ? p[p.length-1] : null; }
function avatar(c, lg){
  const p = c && latestPhoto(c);
  return '<span class="av'+(lg?" lg":"")+'">'+(p?'<img alt="" src="'+esc(photoSrc(p.id))+'">':esc(initials(c&&c.name)))+'</span>';
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current", String(t.dataset.view===S.view)));
  $("#shopName").textContent = S.settings.name || "SMN Cutz";
  const m = $("#main");
  if (S.err){ m.innerHTML = '<div class="offline"><h2>Can\'t reach your client book</h2><p>'+esc(S.err)+'</p></div>'; return; }
  if (!S.gotC || !S.gotB){ return; }
  let h = "";
  const ex = [...S.clients.values()].some(c=>c.example) || [...S.bookings.values()].some(b=>b.example);
  if (ex) h += '<div class="banner"><span>These are example clients and bookings so you can see how it works. Clear them when you\'re ready to add your own.</span><button class="btn small" data-act="clear-ex">Clear examples</button></div>';
  if (S.view==="today") h += viewToday();
  else if (S.view==="bookings") h += viewBookings();
  else if (S.view==="portfolio") h += viewPortfolio();
  else if (S.view==="money") h += viewMoney();
  else h += viewClients();
  const li = $("#linkIn"), liVal = li ? li.value : null, liFocus = li && document.activeElement===li;
  m.innerHTML = h;
  const li2 = $("#linkIn"); if (li2 && liVal!==null){ li2.value = liVal; if (liFocus) li2.focus(); }
  if (S.open) renderSheet();
}

function apptRow(b, opts={}){
  const live = b.status==="booked" || b.status==="confirmed";
  let right = '<span class="price">'+(b.price?money(b.price):"")+'</span>';
  if (b.source==="online"||b.source==="form") right = '<span class="pill online">Online</span>' + right;
  if (b.status==="booked"){
    right += '<span class="pill booked">Pending</span><button class="btn small ok" data-act="confirm" data-id="'+b.id+'">Confirm</button><button class="btn small no" data-act="decline" data-id="'+b.id+'">Decline</button>';
  } else if (b.status==="confirmed"){
    right += '<span class="pill confirmed">Confirmed</span><button class="btn small" data-act="complete" data-id="'+b.id+'">Complete</button>';
  } else if (b.status==="done"){
    right += b.paid ? '<button class="btn small paidbtn" data-act="unpay" data-id="'+b.id+'" title="Tap to mark not paid">Paid ✓</button>'
                    : '<button class="btn small unpaidbtn" data-act="pay" data-id="'+b.id+'" title="Tap when they pay">Not paid · Mark paid</button>';
  } else right += '<span class="pill '+b.status+'">'+(STATUS[b.status]||b.status)+'</span>';
  if (live && b.date>=TODAY) right += '<a class="btn small ghost" href="'+esc(gcalUrl(b))+'" target="_blank" rel="noopener" title="Add to Google Calendar">+ Calendar</a>';
  right += '<button class="btn small ghost" data-act="edit-b" data-id="'+b.id+'" aria-label="Edit booking">Edit</button>';
  const first = opts.dateCol ? '<span class="t" style="font-size:13px">'+esc(b.date===TODAY?"Today":fmtShort(b.date))+'<br><span style="color:var(--ink-3)">'+fmtTime(b.time)+'</span></span>' : '<span class="t">'+fmtTime(b.time)+'</span>';
  const cls = 'appt is-'+b.status+(b.status==="done"?(b.paid?" paid":" unpaid"):"");
  return '<div class="'+cls+'">'+first+
    '<div class="who">'+(opts.hideName?'<div>'+esc(b.service||"Haircut")+'</div>':'<b data-act="open" data-id="'+esc(b.clientId||"")+'">'+esc(clientName(b.clientId,b.clientName))+'</b>')+
    '<div class="svc">'+(opts.hideName?esc(b.notes||""):esc([b.service,b.notes].filter(Boolean).join(" · ")))+'</div></div>'+
    '<div class="right">'+right+'</div></div>';
}

/* ---------- booking requests (from the public booking page) ---------- */
function agoTime(ms){ const m = Math.round((Date.now()-ms)/60000); return m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+"h ago":Math.round(m/1440)+"d ago"; }
function pendingRequests(){ return (S.requests||[]).filter(r=>!S.handled.has(r.key)).sort((a,b)=>b.at-a.at); }
function requestsHtml(){
  const pend = pendingRequests();
  let h = '<div class="sec-h"><h2>New requests'+(pend.length?' <span class="count">'+pend.length+'</span>':'')+'</h2><span class="meta">from your booking page</span></div><div class="panel">';
  if (!pend.length) h += '<div class="empty"><b>No new requests</b>When someone books on your site, they pop up here and you pick the day and time.</div>';
  else h += pend.map(r=>{ const p = pickFromText(r.wants);
    return '<div class="req"><div class="info"><b>'+esc(r.name)+'</b>'+(r.ig?' <a class="ig" href="https://instagram.com/'+encodeURIComponent(r.ig)+'" target="_blank" rel="noopener">@'+esc(r.ig)+'</a>':'')+
      '<div>'+esc(labelFor(p))+(p.has("other")&&p.size===1?'':' · '+money(priceFor(p))+(p.has("other")?'+':''))+(r.phone?' · <span class="mono">'+esc(r.phone)+'</span>':'')+'</div>'+
      (r.other?'<div class="rn">Other: “'+esc(r.other)+'”</div>':'')+
      (r.notes?'<div class="rn">'+esc(r.notes)+'</div>':'')+
      '<div class="rt">'+(r.at?'asked '+esc(agoTime(r.at)):'')+(r.heard?' · heard from '+esc(r.heard):'')+'</div></div>'+
      '<div class="ra"><button class="btn small primary" data-act="sched" data-id="'+r.key+'">Pick a time</button><button class="btn small ghost" data-act="dismiss" data-id="'+r.key+'">Dismiss</button></div></div>'; }).join("");
  return h + '</div>';
}
function bookingCard(){
  const url = location.origin + "/";
  return '<div class="sec-h"><h2>Booking page</h2><span class="meta">clients book here</span></div><div class="panel bookcard">'+
    '<div class="linkrow"><span class="link mono">'+esc(url.replace(/^https?:\/\//,""))+'</span>'+
    '<button class="btn small" data-act="copy-link" data-v="'+esc(url)+'">Copy</button><a class="btn small ghost" href="'+esc(url)+'" target="_blank" rel="noopener">Open</a></div>'+
    '<div class="syncline"><span class="dot '+(S.live?"ok":"")+'"></span><span>'+(S.live?"Live: new requests show up here right away.":"Checks for new requests every minute.")+' Put this link in your IG bio.</span></div></div>';
}

/* ---------- Google Calendar (one tap) ---------- */
function calTitle(b){ return clientName(b.clientId, b.clientName)+" — "+(b.service||"Cut"); }
function gcalUrl(b){
  const stamp = (date,time,add) => { const [y,m,d] = date.split("-").map(Number); const [hh,mm] = (time||"00:00").split(":").map(Number);
    const dt = new Date(y,m-1,d,hh,mm+(add||0)); return dt.getFullYear()+pad(dt.getMonth()+1)+pad(dt.getDate())+"T"+pad(dt.getHours())+pad(dt.getMinutes())+"00"; };
  const dates = b.time ? stamp(b.date,b.time)+"/"+stamp(b.date,b.time,b.mins||30) : b.date.replace(/-/g,"")+"/"+addDays(b.date,1).replace(/-/g,"");
  const c = S.clients.get(b.clientId);
  const details = [c&&c.phone?"Phone: "+c.phone:"", b.price?"Price: "+money(b.price):"", b.notes||""].filter(Boolean).join("\n");
  let tz = "America/New_York"; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; } catch(_){}
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(calTitle(b))+"&dates="+dates+"&ctz="+encodeURIComponent(tz)+"&details="+encodeURIComponent(details);
}
/* confetti: a quick burst in barber-pole colors (skipped if the device asks for less motion) */
function confetti(){
  try { if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return; } catch(_){}
  const cv = document.createElement("canvas");
  cv.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999";
  document.body.appendChild(cv);
  const ctx = cv.getContext("2d"), dpr = Math.min(2, window.devicePixelRatio||1);
  const W = innerWidth, H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; ctx.scale(dpr,dpr);
  const colors = ["#C8102E","#1E3A64","#FFFFFF","#E2A400","#E3485F","#8DB1E8"];
  const parts = [];
  const burst = (x, dir) => { for (let i=0;i<90;i++){ const a = (dir + (Math.random()-.5)*1.1), sp = 7+Math.random()*9;
    parts.push({x, y:H*0.75, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, w:6+Math.random()*6, h:8+Math.random()*8, r:Math.random()*6, vr:(Math.random()-.5)*.35, c:colors[i%colors.length], life:0}); } };
  burst(0, -Math.PI/3); burst(W, -2*Math.PI/3);
  for (let i=0;i<70;i++) parts.push({x:Math.random()*W, y:-20-Math.random()*H*.4, vx:(Math.random()-.5)*2, vy:2+Math.random()*3, w:6+Math.random()*6, h:8+Math.random()*8, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:colors[i%colors.length], life:0});
  const t0 = performance.now();
  (function frame(t){
    const el = t - t0; ctx.clearRect(0,0,W,H);
    if (el < 4200 && Math.random() < .7) for (let k=0;k<3;k++) parts.push({x:Math.random()*W, y:-15, vx:(Math.random()-.5)*2, vy:1.5+Math.random()*2.5, w:6+Math.random()*6, h:8+Math.random()*8, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:colors[(Math.random()*colors.length)|0], life:0});
    if (el > 1200 && el < 1300 && !parts.second){ parts.second = 1; burst(0, -Math.PI/3); burst(W, -2*Math.PI/3); }
    for (const p of parts){ p.vy += p.y < 0 ? 0.05 : 0.12; if (p.vy > 4.5) p.vy = 4.5; p.vx *= 0.99; p.vy *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - Math.max(0, el-5600)/1400); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*1.7))+1); ctx.restore(); }
    if (el < 7000) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

function removeCal(){}
function sqlHint(err){ return /column|violates|check/i.test((err&&err.message)||"") ? "Run the newest setup.sql in Supabase first, then try again." : "Couldn't update. Try again."; }

/* ---------- photos (private storage, signed links) ---------- */
const BLANK = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
S.urls = new Map(); S.live = false; let urlQueue = new Set(), urlTimer = null;
function photoSrc(path){
  const hit = S.urls.get(path); if (hit && hit.exp > Date.now()) return hit.url;
  urlQueue.add(path); clearTimeout(urlTimer); urlTimer = setTimeout(fetchUrls, 30);
  return BLANK;
}
async function fetchUrls(){
  const paths = [...urlQueue]; urlQueue = new Set(); if (!paths.length || !sb) return;
  const { data, error } = await sb.storage.from("photos").createSignedUrls(paths, 3600);
  if (error || !data) return;
  for (const d of data) if (d.signedUrl) S.urls.set(d.path, {url:d.signedUrl, exp:Date.now()+55*60000});
  render(); if (S.open) renderSheet();
  const lb = $("#lbRoot img"); if (lb && lb.dataset.path) lb.src = photoSrc(lb.dataset.path);
}

function dueList(){
  return [...S.clients.values()].map(c=>({c,s:statsFor(c)}))
    .filter(x=>x.s.dueIn!=null && x.s.dueIn<=3 && !x.s.next)
    .sort((a,b)=>a.s.dueIn-b.s.dueIn);
}

function viewToday(){
  const all = [...S.bookings.values()];
  const byTime = (a,b)=>(a.date+(a.time||"99")).localeCompare(b.date+(b.time||"99"));
  const weekEnd = addDays(TODAY,6);
  const pending = all.filter(b=>b.status==="booked").sort(byTime);
  const chair = all.filter(b=>b.status==="confirmed" && b.date<=weekEnd).sort(byTime);
  const later = all.filter(b=>b.status==="confirmed" && b.date>weekEnd).length;
  const completed = all.filter(b=>b.status==="done").sort((a,b)=>byTime(b,a));
  const month = TODAY.slice(0,7);
  const doneMonth = completed.filter(b=>b.date.startsWith(month));
  const earned = doneMonth.filter(b=>b.paid).reduce((s,b)=>s+(+b.price||0),0);
  const unpaid = completed.filter(b=>!b.paid);
  const owed = unpaid.reduce((s,b)=>s+(+b.price||0),0);
  const due = dueList();

  let h = '<div class="stats">'+
    '<div class="stat"><div class="k">Coming up</div><div class="v">'+chair.length+'</div><div class="s">'+(pending.length?pending.length+' waiting to confirm':'confirmed cuts')+'</div></div>'+
    '<div class="stat"><div class="k">Earned · '+esc(parse(TODAY).toLocaleDateString(undefined,{month:"short"}))+'</div><div class="v money-v">'+money(earned)+'</div><div class="s">'+(owed?'<span class="owed">'+money(owed)+' not paid yet</span>':'all paid up')+'</div></div>'+
    '<div class="stat"><div class="k">Due for a cut</div><div class="v">'+due.length+'</div><div class="s">no booking yet</div></div>'+
    '<div class="stat"><div class="k">Cuts this month</div><div class="v">'+doneMonth.length+'</div><div class="s">completed</div></div></div>';

  h += '<div class="cols"><section>' + requestsHtml();
  if (pending.length){
    h += '<div class="sec-h" style="margin-top:22px"><h2>Waiting to confirm <span class="count">'+pending.length+'</span></h2><span class="meta">confirm or decline</span></div><div class="panel">';
    h += pending.map(b=>apptRow(b,{dateCol:true})).join("") + '</div>';
  }
  h += '<div class="sec-h" style="margin-top:22px"><h2>Coming up</h2><span class="meta">'+esc(fmtShort(TODAY))+' – '+esc(fmtShort(weekEnd))+'</span></div><div class="panel">';

/* ---------- Money (finances) ---------- */
function monthKey(d){ return d ? d.slice(0,7) : null; }
function monthName(k, long){ const [y,m] = k.split("-").map(Number); return new Date(y,m-1,1).toLocaleDateString(undefined,{month:long?"long":"short", year: long?"numeric":undefined}); }
function moneyTotals(){
  const paid = [...S.bookings.values()].filter(b=>b.status==="done" && b.paid);
  const unpaid = [...S.bookings.values()].filter(b=>b.status==="done" && !b.paid);
  const m = S.money || [];
  const inc = m.filter(x=>x.kind==="income"), exp = m.filter(x=>x.kind==="expense");
  const sum = a => a.reduce((s,x)=>s+(+x.price||+x.amount||0),0);
  const months = {};
  const add = (k, key, v) => { if (!k) return; (months[k] = months[k] || {rev:0, cost:0, cuts:0})[key] += v; };
  paid.forEach(b=>{ add(monthKey(b.date),"rev",+b.price||0); add(monthKey(b.date),"cuts",1); });
  inc.forEach(x=>add(monthKey(x.date),"rev",+x.amount||0));
  exp.forEach(x=>add(monthKey(x.date),"cost",+x.amount||0));
  const rev = sum(paid) + sum(inc), cost = sum(exp);
  return { paid, unpaid, inc, exp, rev, cost, profit: rev-cost, owed: sum(unpaid), months, cutsPaid: paid.length };
}
function moneyChart(months){
  // last 6 months, oldest → newest
  const keys = []; const d = parse(TODAY); d.setDate(1);
  for (let i=5;i>=0;i--){ const x = new Date(d.getFullYear(), d.getMonth()-i, 1); keys.push(x.getFullYear()+"-"+pad(x.getMonth()+1)); }
  const data = keys.map(k=>({k, rev:(months[k]||{}).rev||0, cost:(months[k]||{}).cost||0}));
  const max = Math.max(50, ...data.map(x=>Math.max(x.rev,x.cost)));
  const step = max<=100?25:max<=300?50:max<=600?100:max<=1500?250:500;
  const top = Math.ceil(max/step)*step;
  const W = 640, H = 220, L = 44, R = 8, T = 10, B = 26, cw = (W-L-R)/data.length, bw = Math.min(26, cw/2-6);
  const y = v => T + (H-T-B) * (1 - v/top);
  let g = '';
  for (let v=0; v<=top; v+=step) g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" class="grid"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" class="ax" text-anchor="end">$'+v+'</text>';
  const bar = (x, v, cls, label) => { if (!v) return ''; const h = H-B-y(v); const r = Math.min(4, h);
    return '<path class="'+cls+'" d="M'+x+','+(H-B)+' v'+(-(h-r))+' q0,'+(-r)+' '+r+','+(-r)+' h'+(bw-2*r)+' q'+r+',0 '+r+','+r+' v'+(h-r)+' z"><title>'+label+'</title></path>'; };
  data.forEach((m,i)=>{
    const cx = L + cw*i + cw/2;
    g += bar(cx-bw-1, m.rev, "rev", monthName(m.k,true)+": "+money(m.rev)+" made");
    g += bar(cx+1, m.cost, "cost", monthName(m.k,true)+": "+money(m.cost)+" spent");
    g += '<rect x="'+(L+cw*i)+'" y="'+T+'" width="'+cw+'" height="'+(H-T-B)+'" class="hit" data-m="'+m.k+'"><title>'+monthName(m.k,true)+" · made "+money(m.rev)+" · spent "+money(m.cost)+" · profit "+money(m.rev-m.cost)+'</title></rect>';
    g += '<text x="'+cx+'" y="'+(H-8)+'" class="ax'+(m.k===TODAY.slice(0,7)?' now':'')+'" text-anchor="middle">'+monthName(m.k)+'</text>';
  });
  return '<div class="chart-wrap"><div class="legend"><span><i class="sw rev"></i>Made</span><span><i class="sw cost"></i>Spent</span></div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Money made and spent, last 6 months">'+g+'</svg></div>'+
    '<div class="mtable" style="overflow-x:auto"><table><thead><tr><th>Month</th><th>Made</th><th>Spent</th><th>Profit</th></tr></thead><tbody>'+
    data.slice().reverse().map(m=>'<tr><td>'+esc(monthName(m.k,true))+'</td><td>'+money(m.rev)+'</td><td>'+money(m.cost)+'</td><td class="'+(m.rev-m.cost<0?'neg':'')+'">'+money(m.rev-m.cost)+'</td></tr>').join("")+'</tbody></table></div>';
}
function moneyRow(x){
  return '<div class="mrow"><div class="mi"><b>'+esc(x.item||"—")+'</b><span>'+(x.date?esc(fmtShort(x.date)):"Before the app")+(x.note?' · '+esc(x.note):'')+'</span></div>'+
    '<span class="ma '+x.kind+'">'+(x.kind==="expense"?"−":"+")+money(x.amount)+'</span>'+
    '<button class="btn small ghost" data-act="money-del" data-id="'+x.id+'" aria-label="Delete">✕</button></div>';
}

  h += '<div class="cols"><section><div class="sec-h"><h2>Last 6 months</h2><span class="meta">updates by itself</span></div><div class="panel chart-panel">'+moneyChart(t.months)+'</div>';

    (t.exp.length ? t.exp.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(moneyRow).join("") : '<div class="empty">No expenses yet.</div>')+'</div>';
  h += '<div class="sec-h" style="margin-top:22px"><h2>Extra income</h2><button class="btn small ghost" data-act="inc-add">+ Add</button></div><div class="panel">'+
    (S.incForm ? '<form class="addm" id="incForm"><input id="incItem" placeholder="e.g. Tip, house call" maxlength="80" required aria-label="Income item"><div class="two"><input id="incAmt" type="number" min="0" step="0.01" inputmode="decimal" placeholder="$ Amount" required aria-label="Amount"><input id="incDate" type="date" value="'+TODAY+'" aria-label="Date"></div><button class="btn primary" type="submit">Add income</button></form>' : '')+
    (t.inc.length ? t.inc.map(moneyRow).join("") : (S.incForm?'':'<div class="empty">Tips or cash that isn\'t a booking go here.</div>'))+'</div></section></div>';
  return h;
}
async function addMoney(kind, item, amount, date){

}

/* ---------- photos ---------- */
function shrink(file){
  return new Promise(res => {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return res(file);
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const max = 1600, sc = Math.min(1, max/Math.max(img.width,img.height));
      if (sc===1 && file.size < 1.5e6){ URL.revokeObjectURL(url); return res(file); }
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url);
      cv.toBlob(b=>res(b||file),"image/jpeg",.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}

let armed = null;
function arm(btn, label){
  if (armed === btn) return true;
  if (armed) { armed.classList.remove("armed"); armed.textContent = armed.dataset.orig; }
  armed = btn; btn.dataset.orig = btn.textContent; btn.textContent = label; btn.classList.add("armed");
  setTimeout(()=>{ if(armed===btn){ btn.classList.remove("armed"); btn.textContent = btn.dataset.orig; armed=null; } }, 4000);
  return false;
}

/* ---------- Supabase ---------- */
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));
const sb = window.supabase.createClient(SMN.url, SMN.key, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
const TABLES = {
  clients:  {name:"name", phone:"phone", instagram:"instagram", email:"email", cut:"cut", notes:"notes", cycleWeeks:"cycle_weeks", photos:"photos", source:"source", createdAt:"created_at"},
  bookings: {clientId:"client_id", clientName:"client_name", date:"date", time:"time", service:"service", price:"price", mins:"mins", status:"status", notes:"notes", source:"source", requestKey:"request_id", paid:"paid"},
  requests: {status:"status", bookingId:"booking_id"},
};
function toRow(table, obj){ const map = TABLES[table], row = {}; for (const k in obj) if (map[k] && obj[k]!==undefined) row[map[k]] = obj[k]; if (row.date==="") delete row.date; return row; }
function fromRow(table, row){ const map = TABLES[table], o = {id:row.id}; for (const k in map) if (row[map[k]]!==undefined) o[k] = row[map[k]]; if (o.cycleWeeks!=null) o.cycleWeeks = +o.cycleWeeks; if (o.price!=null) o.price = +o.price; if (o.time==null) o.time=""; return o; }
function fail(error){ if (error) throw {code: error.code==="23505"?"conflict":"invalid_argument", message:error.message}; }
// Small adapter so the app code reads the same as before: collection("x").doc(id).set/update/delete
S.db = {
  collection(table){ return { doc(id){ id = id || uuid(); return {
    id,
    async set(obj){
      if (table==="requests") return this.update(obj);
      const row = Object.assign(toRow(table,obj), {id});
      const { error } = await sb.from(table).upsert(row); fail(error); applyLocal(table, id, obj, true);
    },
    async update(obj){ const { error } = await sb.from(table).update(toRow(table,obj)).eq("id",id); fail(error); applyLocal(table, id, obj, false); },
    async delete(){ const { error } = await sb.from(table).delete().eq("id",id); fail(error); applyLocal(table, id, null); },
  }; } }; },
  doc(){ return { async set(){} }; },
};
function applyLocal(table, id, obj, replace){
  if (table==="requests"){ if (obj && obj.status && obj.status!=="new") S.handled.add(id); render(); return; }
  const m = table==="clients" ? S.clients : S.bookings;
  if (obj===null) m.delete(id); else m.set(id, Object.assign({id}, replace ? {} : (m.get(id)||{}), obj));
  render(); if (S.open) renderSheet();
}
S.assets = {
  async upload(blob){
    const ext = (blob.type||"image/jpeg").split("/")[1].replace("jpeg","jpg");
    const path = (S.open||"misc")+"/"+uuid()+"."+ext;
    const { error } = await sb.storage.from("photos").upload(path, blob, {contentType:blob.type||"image/jpeg", upsert:false});
    if (error) throw {code: /size|large/i.test(error.message)?"too_large":"upstream_error"};
    return {id:path};
  },
  async delete(path){ await sb.storage.from("photos").remove([path]); },
};

async function loadAll(){
  const [c, b, r, mo] = await Promise.all([
    sb.from("clients").select("*"),
    sb.from("bookings").select("*"),
    sb.from("requests").select("*").order("created_at",{ascending:false}).limit(500),
    sb.from("money").select("*"),
  ]);
  if (c.error || b.error || r.error){ if (!S.gotC) { S.err = "Couldn't load your client book. Check your connection and reload."; render(); } return; }
  S.money = mo.error ? (S.money||[]) : mo.data.map(x=>({id:x.id, kind:x.kind, item:x.item, amount:+x.amount||0, date:x.date, note:x.note||""}));
  S.clients = new Map(c.data.map(x=>[x.id, fromRow("clients",x)]));
  S.bookings = new Map(b.data.map(x=>[x.id, fromRow("bookings",x)]));
  const before = S.gotC ? new Set(pendingRequests().map(x=>x.key)) : null;
  S.requests = r.data.map(x=>({ key:x.id, name:x.name, phone:x.phone||"", ig:x.instagram||"", heard:x.heard_from||"", other:x.other_request||"", wants:(x.services||[]).join(", "), notes:x.notes||"", at:Date.parse(x.created_at)||0 }));
  S.handled = new Set(r.data.filter(x=>x.status!=="new").map(x=>x.id));
  S.gotC = S.gotB = true;
  if (before){ const fresh = pendingRequests().filter(x=>!before.has(x.key)); if (fresh.length){ confetti(); toast(fresh.length===1 ? "New booking request from "+fresh[0].name : fresh.length+" new booking requests", 5000); } }
  render(); if (S.open) renderSheet();
}
let reloadTimer = null;
function queueReload(){ clearTimeout(reloadTimer); reloadTimer = setTimeout(loadAll, 400); }

/* ---------- login ---------- */
function showLogin(msg){
  $("#app").hidden = true; $("#login").hidden = false;
  $("#loginMsg").textContent = msg || "";
}
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("#loginEmail").value.trim(), password = $("#loginPass").value;
  if (!email){ $("#loginEmail").focus(); return; }
  if (!password){ $("#loginPass").focus(); $("#loginMsg").textContent = "Enter your password, or use the email link below."; return; }
  const btn = $("#loginBtn"); btn.disabled = true; btn.textContent = "Logging in…";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = "Log in";
  if (error) $("#loginMsg").textContent = /invalid/i.test(error.message) ? "Wrong email or password." : "Couldn't log in: "+error.message;
});
$("#linkBtn").addEventListener("click", async () => {
  const email = $("#loginEmail").value.trim(); if (!email){ $("#loginEmail").focus(); $("#loginMsg").textContent = "Type your email first."; return; }
  const btn = $("#linkBtn"); btn.disabled = true;
  const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin + "/admin", shouldCreateUser:false } });
  btn.disabled = false;
  $("#loginMsg").textContent = error ? (/rate/i.test(error.message) ? "Too many login emails for now. Try again in an hour, or use your password." : "Couldn't send the link: "+error.message) : "Check your email for the login link, then tap it on this device.";
});
$("#logoutBtn").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });

let started = false;
async function start(session){
  if (!session){ showLogin(); return; }
  if (started) return; started = true;
  const { data:isOwner } = await sb.rpc("is_owner");
  if (!isOwner){ started = false; await sb.auth.signOut(); showLogin("That email isn't the SMN Cutz owner account."); return; }
  $("#login").hidden = true; $("#app").hidden = false;
  await loadAll();
  loadPortfolio();
  sb.channel("smn-live")
    .on("postgres_changes", {event:"*", schema:"public", table:"requests"}, queueReload)
    .on("postgres_changes", {event:"*", schema:"public", table:"bookings"}, queueReload)
    .on("postgres_changes", {event:"*", schema:"public", table:"clients"}, queueReload)
    .on("postgres_changes", {event:"*", schema:"public", table:"money"}, queueReload)
    .subscribe(status => { S.live = status==="SUBSCRIBED"; render(); });
  setInterval(loadAll, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) loadAll(); });
}
sb.auth.onAuthStateChange((_evt, session) => { if (session) start(session); });
sb.auth.getSession().then(({data}) => start(data.session));
})();
</script>
